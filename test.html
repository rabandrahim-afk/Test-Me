<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TEST ME | Mock Test</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6fb;
    color:#172033;
    padding-bottom:30px;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#3020b8,#135dcc);
    color:white;
    padding:20px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:10;
}

.brand{
    font-size:27px;
    font-weight:900;
}

.brand span{
    color:#ffd21f;
}

.exam-name{
    font-size:14px;
    margin-top:5px;
    opacity:.9;
}

.timer{
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.4);
    padding:12px 17px;
    border-radius:16px;
    font-size:20px;
    font-weight:bold;
}

/* PROGRESS */

.progress-box{
    background:white;
    padding:18px;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.progress-top{
    display:flex;
    justify-content:space-between;
    font-weight:bold;
    margin-bottom:12px;
}

.progress{
    height:9px;
    background:#e5e9f2;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#5425d9,#1673e8);
    transition:.3s;
}

/* MAIN */

.container{
    max-width:850px;
    margin:auto;
    padding:20px 15px;
}

/* QUESTION CARD */

.question-card{
    background:white;
    border-radius:25px;
    padding:22px;
    box-shadow:0 8px 30px rgba(30,45,80,.09);
    margin-bottom:20px;
}

.question-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.q-number{
    background:#eee8ff;
    color:#5425d9;
    padding:10px 16px;
    border-radius:13px;
    font-weight:800;
}

.difficulty{
    background:#e7f8ee;
    color:#16834c;
    padding:9px 15px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

.question{
    font-size:20px;
    line-height:1.55;
    font-weight:700;
    margin-bottom:25px;
}

/* OPTIONS */

.options{
    display:flex;
    flex-direction:column;
    gap:13px;
}

.option{
    border:2px solid #e4e7ef;
    background:#fafbfe;
    border-radius:15px;
    padding:16px;
    cursor:pointer;
    font-size:16px;
    transition:.2s;
}

.option:hover{
    border-color:#5b35dc;
    background:#f5f1ff;
}

.option.selected{
    border-color:#5425d9;
    background:#eee8ff;
    color:#3e209d;
    font-weight:bold;
}

.option-number{
    display:inline-flex;
    width:32px;
    height:32px;
    border-radius:50%;
    align-items:center;
    justify-content:center;
    background:#e8ebf3;
    margin-right:10px;
    font-weight:bold;
}

/* BUTTONS */

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:12px;
}

button{
    border:none;
    padding:15px;
    border-radius:15px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.previous{
    background:#e8ebf3;
    color:#263148;
}

.next{
    background:linear-gradient(135deg,#5425d9,#1471e8);
    color:white;
}

.review{
    background:#fff3d2;
    color:#a16b00;
}

.clear{
    background:#ffe9e9;
    color:#d63232;
}

.submit{
    width:100%;
    background:#12a66a;
    color:white;
    font-size:17px;
}

/* PALETTE */

.palette-card{
    background:white;
    border-radius:25px;
    padding:20px;
    box-shadow:0 8px 30px rgba(30,45,80,.08);
}

.palette-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:18px;
}

.palette{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:9px;
}

.p-number{
    height:40px;
    border-radius:10px;
    background:#edf0f5;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    cursor:pointer;
}

.p-number.current{
    background:#5425d9;
    color:white;
}

.p-number.answered{
    background:#12a66a;
    color:white;
}

.p-number.reviewed{
    background:#f2a900;
    color:white;
}

/* LEGEND */

.legend{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    margin-top:20px;
    font-size:13px;
}

.legend-item{
    display:flex;
    align-items:center;
    gap:6px;
}

.dot{
    width:14px;
    height:14px;
    border-radius:4px;
    background:#edf0f5;
}

.dot.green{
    background:#12a66a;
}

.dot.yellow{
    background:#f2a900;
}

.dot.purple{
    background:#5425d9;
}

/* RESULT */

.result{
    display:none;
    background:white;
    border-radius:25px;
    padding:30px;
    text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.result h1{
    color:#5425d9;
    margin-bottom:15px;
}

.score{
    font-size:45px;
    font-weight:900;
    margin:20px;
}

.home-btn{
    background:#5425d9;
    color:white;
    width:100%;
}

/* MOBILE */

@media(max-width:600px){

    .header{
        padding:16px 14px;
    }

    .brand{
        font-size:24px;
    }

    .timer{
        font-size:17px;
        padding:10px 13px;
    }

    .question{
        font-size:18px;
    }

    .palette{
        grid-template-columns:repeat(5,1fr);
    }

}

</style>
</head>

<body>

<!-- HEADER -->

<header class="header">

    <div>
        <div class="brand">
            TEST <span>ME</span>
        </div>

        <div class="exam-name">
            SSC • UP Exams • Railway
        </div>
    </div>

    <div class="timer" id="timer">
        60:00
    </div>

</header>


<!-- PROGRESS -->

<section class="progress-box">

    <div class="progress-top">

        <span id="questionCounter">
            Question 1 of 0
        </span>

        <span id="answeredCounter">
            0 Answered
        </span>

    </div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

</section>


<!-- MAIN -->

<main class="container">

    <!-- QUESTION -->

    <section class="question-card" id="questionCard">

        <div class="question-top">

            <div class="q-number" id="qNumber">
                Q.1
            </div>

            <div class="difficulty" id="difficulty">
                Easy
            </div>

        </div>

        <div class="question" id="questionText">
            Loading Question...
        </div>

        <div class="options" id="options">
        </div>

    </section>


    <!-- ACTION BUTTONS -->

    <div class="actions">

        <button class="clear" onclick="clearAnswer()">
            Clear Response
        </button>

        <button class="review" onclick="markReview()">
            Mark for Review
        </button>

    </div>


    <div class="actions">

        <button class="previous" onclick="previousQuestion()">
            ← Previous
        </button>

        <button class="next" onclick="nextQuestion()">
            Next →
        </button>

    </div>


    <button class="submit" onclick="submitTest()">
        SUBMIT TEST
    </button>


    <!-- PALETTE -->

    <section class="palette-card" style="margin-top:20px;">

        <div class="palette-title">
            Question Palette
        </div>

        <div class="palette" id="palette">
        </div>

        <div class="legend">

            <div class="legend-item">
                <div class="dot"></div>
                Not Visited
            </div>

            <div class="legend-item">
                <div class="dot green"></div>
                Answered
            </div>

            <div class="legend-item">
                <div class="dot yellow"></div>
                Review
            </div>

            <div class="legend-item">
                <div class="dot purple"></div>
                Current
            </div>

        </div>

    </section>


    <!-- RESULT -->

    <section class="result" id="result">

        <h1>TEST ME</h1>

        <p>Test Completed Successfully</p>

        <div class="score" id="finalScore">
            0 / 0
        </div>

        <p id="resultMessage">
            Keep practicing.
        </p>

        <br>

        <button class="home-btn" onclick="goHome()">
            BACK TO HOME
        </button>

    </section>

</main>


<script>

let questions = [];
let currentQuestion = 0;

let userAnswers = [];
let reviewQuestions = [];

let timeLeft = 60 * 60;

let timerInterval;


/* LOAD QUESTION BANK */

async function loadQuestions(){

    try{

        const response = await fetch(
            "data/questions.json?cache=" + Date.now()
        );

        if(!response.ok){
            throw new Error("Question bank not found");
        }

        questions = await response.json();

        if(!Array.isArray(questions) || questions.length === 0){
            throw new Error("Question bank empty");
        }

        userAnswers = new Array(questions.length).fill(null);
        reviewQuestions = new Array(questions.length).fill(false);

        createPalette();

        showQuestion();

        startTimer();

    }

    catch(error){

        console.error(error);

        document.getElementById("questionText").innerHTML =
        "Question Bank load nahi ho pa raha.<br><br>" +
        "Please check <b>data/questions.json</b>";

    }

}


/* SHOW QUESTION */

function showQuestion(){

    if(!questions.length) return;

    const q = questions[currentQuestion];

    document.getElementById("qNumber").innerText =
        "Q." + (currentQuestion + 1);

    document.getElementById("questionCounter").innerText =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;

    document.getElementById("difficulty").innerText =
        q.difficulty || "Easy";

    document.getElementById("questionText").innerText =
        q.question;

    const optionsBox =
        document.getElementById("options");

    optionsBox.innerHTML = "";

    q.options.forEach((option,index)=>{

        const div = document.createElement("div");

        div.className = "option";

        if(userAnswers[currentQuestion] === index){
            div.classList.add("selected");
        }

        div.innerHTML =
            '<span class="option-number">' +
            String.fromCharCode(65 + index) +
            '</span>' +
            option;

        div.onclick = function(){

            selectAnswer(index);

        };

        optionsBox.appendChild(div);

    });

    updateProgress();

    updatePalette();

}


/* SELECT ANSWER */

function selectAnswer(index){

    userAnswers[currentQuestion] = index;

    showQuestion();

}


/* CLEAR */

function clearAnswer(){

    userAnswers[currentQuestion] = null;

    showQuestion();

}


/* REVIEW */

function markReview(){

    reviewQuestions[currentQuestion] =
        !reviewQuestions[currentQuestion];

    updatePalette();

}


/* NEXT */

function nextQuestion(){

    if(currentQuestion < questions.length - 1){

        currentQuestion++;

        showQuestion();

    }

}


/* PREVIOUS */

function previousQuestion(){

    if(currentQuestion > 0){

        currentQuestion--;

        showQuestion();

    }

}


/* PROGRESS */

function updateProgress(){

    const answered =
        userAnswers.filter(
            answer => answer !== null
        ).length;

    document.getElementById("answeredCounter").innerText =
        answered + " Answered";

    const percentage =
        questions.length
        ? (answered / questions.length) * 100
        : 0;

    document.getElementById("progressBar").style.width =
        percentage + "%";

}


/* PALETTE */

function createPalette(){

    const palette =
        document.getElementById("palette");

    palette.innerHTML = "";

    questions.forEach((q,index)=>{

        const button =
            document.createElement("div");

        button.className = "p-number";

        button.innerText = index + 1;

        button.onclick = function(){

            currentQuestion = index;

            showQuestion();

        };

        palette.appendChild(button);

    });

}


/* UPDATE PALETTE */

function updatePalette(){

    const buttons =
        document.querySelectorAll(".p-number");

    buttons.forEach((button,index)=>{

        button.className = "p-number";

        if(reviewQuestions[index]){

            button.classList.add("reviewed");

        }
        else if(userAnswers[index] !== null){

            button.classList.add("answered");

        }

        if(index === currentQuestion){

            button.classList.add("current");

        }

    });

}


/* TIMER */

function startTimer(){

    clearInterval(timerInterval);

    timerInterval =
        setInterval(()=>{

            if(timeLeft <= 0){

                clearInterval(timerInterval);

                submitTest();

                return;

            }

            timeLeft--;

            const minutes =
                Math.floor(timeLeft / 60);

            const seconds =
                timeLeft % 60;

            document.getElementById("timer").innerText =
                String(minutes).padStart(2,"0") +
                ":" +
                String(seconds).padStart(2,"0");

        },1000);

}


/* SUBMIT */

function submitTest(){

    clearInterval(timerInterval);

    let correct = 0;

    questions.forEach((q,index)=>{

        if(userAnswers[index] === q.answer){

            correct++;

        }

    });

    document.getElementById("questionCard").style.display =
        "none";

    document.querySelector(".actions").style.display =
        "none";

    document.querySelectorAll(".actions")[1].style.display =
        "none";

    document.querySelector(".submit").style.display =
        "none";

    document.querySelector(".palette-card").style.display =
        "none";

    document.getElementById("result").style.display =
        "block";

    document.getElementById("finalScore").innerText =
        correct + " / " + questions.length;

    document.getElementById("resultMessage").innerText =
        "Correct Answers: " +
        correct +
        " | Attempted: " +
        userAnswers.filter(
            x => x !== null
        ).length;

}


/* HOME */

function goHome(){

    window.location.href = "index.html";

}


/* START */

loadQuestions();

</script>

</body>
    </html>
