<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TEST ME - Online Test</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f6fb;
    color:#18233b;
}

.header{
    background:linear-gradient(135deg,#3324c9,#1266d6);
    color:white;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:900;
}

.logo span{
    color:#ffd21f;
}

.subtitle{
    font-size:14px;
    margin-top:3px;
}

.timer{
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.4);
    padding:12px 18px;
    border-radius:15px;
    font-size:22px;
    font-weight:bold;
}

.info{
    background:white;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    font-weight:bold;
}

.progress-box{
    background:white;
    padding:0 20px 15px;
}

.progress{
    height:8px;
    background:#e5e8ef;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#5424d8,#196ee8);
}

.container{
    padding:25px 18px;
    max-width:800px;
    margin:auto;
}

.question-card{
    background:white;
    border-radius:25px;
    padding:25px;
    box-shadow:0 8px 30px rgba(20,30,60,.08);
}

.question-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.q-number{
    background:#eee8ff;
    color:#5424d8;
    padding:12px 18px;
    border-radius:15px;
    font-weight:bold;
}

.difficulty{
    background:#e8f8ef;
    color:#16854c;
    padding:10px 16px;
    border-radius:20px;
    font-weight:bold;
}

.section-name{
    font-size:14px;
    color:#68738a;
    margin-bottom:15px;
}

.question{
    font-size:20px;
    line-height:1.55;
    font-weight:700;
    margin-bottom:25px;
}

.options{
    display:grid;
    gap:12px;
}

.option{
    border:2px solid #e5e8ef;
    border-radius:15px;
    padding:15px;
    cursor:pointer;
    transition:.2s;
    background:white;
}

.option:hover{
    border-color:#4d38d5;
    background:#f6f3ff;
}

.option.selected{
    border-color:#4030d0;
    background:#eeeaff;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:25px;
}

button{
    border:0;
    padding:15px;
    border-radius:15px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.clear{
    background:#ffecec;
    color:#d83232;
}

.review{
    background:#fff5d9;
    color:#b47a00;
}

.previous{
    background:#e9edf5;
    color:#25324a;
}

.next{
    background:linear-gradient(135deg,#4d25d4,#1671e8);
    color:white;
}

.submit{
    width:100%;
    margin-top:15px;
    background:#13a66b;
    color:white;
}

.palette{
    background:white;
    margin-top:20px;
    border-radius:25px;
    padding:22px;
}

.palette h2{
    margin-bottom:18px;
}

.palette-grid{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:8px;
}

.p{
    height:38px;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    cursor:pointer;
    background:#edf0f5;
}

.p.answered{
    background:#14a66b;
    color:white;
}

.p.review{
    background:#f4ae00;
    color:white;
}

.p.current{
    background:#5424d8;
    color:white;
}

.loading{
    text-align:center;
    padding:60px 20px;
    font-size:18px;
}

.error{
    background:#fff0f0;
    color:#b42323;
    padding:20px;
    border-radius:15px;
}

@media(max-width:600px){

    .header{
        padding:15px;
    }

    .logo{
        font-size:24px;
    }

    .timer{
        font-size:18px;
        padding:10px;
    }

    .container{
        padding:15px 12px;
    }

    .question-card{
        padding:20px;
    }

    .question{
        font-size:18px;
    }

    .palette-grid{
        grid-template-columns:repeat(6,1fr);
    }

}

</style>
</head>

<body>

<header class="header">

    <div>
        <div class="logo">
            TEST <span>ME</span>
        </div>

        <div class="subtitle">
            SSC • UP Exams • Railway
        </div>
    </div>

    <div class="timer" id="timer">
        00:00
    </div>

</header>


<div class="info">

    <div id="questionInfo">
        Loading...
    </div>

    <div id="answeredInfo">
        0 Answered
    </div>

</div>


<div class="progress-box">

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

</div>


<main class="container">

    <div id="testArea">

        <div class="loading">
            Question Bank Loading...
        </div>

    </div>

</main>


<script>

let examData = null;
let questions = [];

let currentQuestion = 0;

let answers = [];
let marked = [];

let totalSeconds = 0;
let timerInterval = null;


/* ----------------------------------
   GET EXAM FROM URL
----------------------------------- */

const params = new URLSearchParams(window.location.search);

const examId = params.get("exam") || "ssc_cgl";


/* ----------------------------------
   LOAD EXAM CONFIG
----------------------------------- */

async function loadExam(){

    try{

        const configResponse =
            await fetch("./data/exams.json");

        if(!configResponse.ok){
            throw new Error("exams.json not found");
        }

        const exams =
            await configResponse.json();

        examData = exams[examId];

        if(!examData){
            throw new Error(
                "Exam configuration not found: " + examId
            );
        }


        /* Load correct question bank */

        const questionResponse =
            await fetch(
                "./data/" + examData.questionFile
            );

        if(!questionResponse.ok){
            throw new Error(
                examData.questionFile +
                " not found"
            );
        }

        questions =
            await questionResponse.json();


        if(!Array.isArray(questions) ||
           questions.length === 0){

            throw new Error(
                "Question bank is empty"
            );
        }


        /* ----------------------------------
           SET QUESTION COUNT
        ----------------------------------- */

        let requiredQuestions =
            examData.questions ||
            questions.length;

        questions =
            questions.slice(0, requiredQuestions);


        answers =
            new Array(questions.length).fill(null);

        marked =
            new Array(questions.length).fill(false);


        /* ----------------------------------
           SET TIMER
        ----------------------------------- */

        totalSeconds =
            (examData.duration || 60) * 60;

        startTimer();

        renderQuestion();

        renderPalette();

    }

    catch(error){

        document.getElementById("testArea").innerHTML =

        `<div class="error">
            <h2>Question Bank Load Error</h2>
            <br>
            <p>${error.message}</p>
            <br>
            <p>
            Check:
            data/exams.json
            and
            data/${examData?.questionFile || "question-file"}
            </p>
        </div>`;

    }

}


/* ----------------------------------
   TIMER
----------------------------------- */

function startTimer(){

    updateTimer();

    timerInterval =
        setInterval(() => {

            totalSeconds--;

            updateTimer();

            if(totalSeconds <= 0){

                clearInterval(timerInterval);

                submitTest();

            }

        },1000);

}


function updateTimer(){

    const minutes =
        Math.floor(totalSeconds / 60);

    const seconds =
        totalSeconds % 60;

    document.getElementById("timer")
        .textContent =
        String(minutes).padStart(2,"0")
        + ":" +
        String(seconds).padStart(2,"0");

}


/* ----------------------------------
   QUESTION
----------------------------------- */

function renderQuestion(){

    const q =
        questions[currentQuestion];

    document.getElementById("questionInfo")
        .textContent =
        `Question ${currentQuestion + 1} of ${questions.length}`;

    document.getElementById("answeredInfo")
        .textContent =
        `${answers.filter(x => x !== null).length} Answered`;


    const percentage =
        ((currentQuestion + 1) /
        questions.length) * 100;

    document.getElementById("progressBar")
        .style.width =
        percentage + "%";


    let optionsHTML = "";

    q.options.forEach((option,index)=>{

        const selected =
            answers[currentQuestion] === index
            ? "selected"
            : "";

        optionsHTML += `

            <div
                class="option ${selected}"
                onclick="selectOption(${index})"
            >

                <strong>
                    ${String.fromCharCode(65 + index)}.
                </strong>

                ${option}

            </div>

        `;

    });


    document.getElementById("testArea").innerHTML = `

        <div class="question-card">

            <div class="question-top">

                <div class="q-number">
                    Q.${currentQuestion + 1}
                </div>

                <div class="difficulty">
                    ${q.difficulty || "Medium"}
                </div>

            </div>


            <div class="section-name">

                ${q.section || ""}

                ${q.topic ? " • " + q.topic : ""}

            </div>


            <div class="question">

                ${q.question}

            </div>


            <div class="options">

                ${optionsHTML}

            </div>


            <div class="actions">

                <button
                    class="clear"
                    onclick="clearResponse()"
                >
                    Clear Response
                </button>

                <button
                    class="review"
                    onclick="markReview()"
                >
                    ${marked[currentQuestion]
                        ? "Unmark Review"
                        : "Mark for Review"}
                </button>

                <button
                    class="previous"
                    onclick="previousQuestion()"
                >
                    ← Previous
                </button>

                <button
                    class="next"
                    onclick="nextQuestion()"
                >
                    Next →
                </button>

            </div>


            <button
                class="submit"
                onclick="submitTest()"
            >
                SUBMIT TEST
            </button>

        </div>

    `;

}


/* ----------------------------------
   SELECT OPTION
----------------------------------- */

function selectOption(index){

    answers[currentQuestion] = index;

    renderQuestion();

    renderPalette();

}


/* ----------------------------------
   CLEAR
----------------------------------- */

function clearResponse(){

    answers[currentQuestion] = null;

    renderQuestion();

    renderPalette();

}


/* ----------------------------------
   REVIEW
----------------------------------- */

function markReview(){

    marked[currentQuestion] =
        !marked[currentQuestion];

    renderQuestion();

    renderPalette();

}


/* ----------------------------------
   NEXT
----------------------------------- */

function nextQuestion(){

    if(currentQuestion < questions.length - 1){

        currentQuestion++;

        renderQuestion();

        renderPalette();

    }

}


/* ----------------------------------
   PREVIOUS
----------------------------------- */

function previousQuestion(){

    if(currentQuestion > 0){

        currentQuestion--;

        renderQuestion();

        renderPalette();

    }

}


/* ----------------------------------
   PALETTE
----------------------------------- */

function renderPalette(){

    let html = "";

    questions.forEach((q,index)=>{

        let cls = "";

        if(index === currentQuestion){

            cls = "current";

        }
        else if(marked[index]){

            cls = "review";

        }
        else if(answers[index] !== null){

            cls = "answered";

        }


        html += `

            <div
                class="p ${cls}"
                onclick="goToQuestion(${index})"
            >
                ${index + 1}
            </div>

        `;

    });


    const oldPalette =
        document.querySelector(".palette");

    if(oldPalette)
        oldPalette.remove();


    document
        .querySelector(".container")
        .insertAdjacentHTML(
            "beforeend",

            `

            <div class="palette">

                <h2>
                    Question Palette
                </h2>

                <div class="palette-grid">

                    ${html}

                </div>

            </div>

            `

        );

}


function goToQuestion(index){

    currentQuestion = index;

    renderQuestion();

    renderPalette();

}


/* ----------------------------------
   SUBMIT
----------------------------------- */

function submitTest(){

    clearInterval(timerInterval);


    let correct = 0;
    let wrong = 0;
    let unanswered = 0;


    questions.forEach((q,index)=>{

        if(answers[index] === null){

            unanswered++;

        }

        else if(
            answers[index] === q.answer
        ){

            correct++;

        }

        else{

            wrong++;

        }

    });


    let negative =
        examData.negativeMarking || 0;

    let score =
        correct -
        (wrong * negative);


    localStorage.setItem(
        "testMeLastResult",
        JSON.stringify({

            exam: examData.name,

            correct: correct,

            wrong: wrong,

            unanswered: unanswered,

            score: score,

            total: questions.length,

            date: new Date().toISOString()

        })
    );


    alert(

        "TEST ME\n\n" +

        "Exam: " + examData.name + "\n" +

        "Correct: " + correct + "\n" +

        "Wrong: " + wrong + "\n" +

        "Unanswered: " + unanswered + "\n" +

        "Score: " + score

    );

}


loadExam();

</script>

</body>
</html>
